services:
  guardcart:
    build:
      context: ..
    ports:
      - "127.0.0.1:${GUARDCART_LOCAL_PORT:-8000}:8000"
    environment:
      GUARDCART_AI_ENABLED: "false"
      GUARDCART_ALLOWED_ORIGINS: "http://127.0.0.1:${GUARDCART_LOCAL_PORT:-8000},http://localhost:${GUARDCART_LOCAL_PORT:-8000}"
    volumes:
      - guardcart-data:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

volumes:
  guardcart-data:
