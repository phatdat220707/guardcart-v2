name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements.lock
      - run: python -B -m unittest discover -s tests -t . -q
      - run: python -B tools/evaluate_agent.py --validate-only
      - run: node --test frontend/tests/format.test.mjs frontend/tests/recovery.test.mjs frontend/tests/view-state.test.mjs
      - run: node --check frontend/dist/app.js
      - run: python -B tools/package_release.py --check

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: docker compose -f deploy/compose.yaml config --quiet
      - run: docker compose -f deploy/compose.yaml build
      - run: docker compose -f deploy/compose.yaml up --detach --wait --wait-timeout 60
      - run: python -B tools/smoke_test_api.py
      - if: always()
        run: docker compose -f deploy/compose.yaml down
